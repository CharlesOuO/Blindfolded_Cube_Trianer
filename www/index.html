<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description"
        content="3BLD(3 style & letter pairs) practice with words, corners, edges, flashcards, typing tests, and local backup.">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="3BLD">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title data-i18n="page_title"></title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css?v=20261124n">
</head>

<body class="app-booting" onload="bootApp()">
    <div id="boot-overlay" class="boot-overlay" aria-hidden="true">
        <div class="boot-loader">
            <div class="boot-loader-pill"></div>
            <div class="boot-loader-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <header class="app-shell">
        <div class="app-header">
            <button type="button" class="brand" onclick="switchTab('list')" aria-label="3BLD">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-name">3BLD</span>
            </button>
        </div>
        <nav class="nav-bar" aria-label="Main navigation" data-i18n-aria-label="nav_label">
            <div class="nav-container">
                <button type="button" class="nav-btn active" data-view="list" aria-current="page" onclick="switchTab('list')">
                    <span class="nav-icon icon-pairs" aria-hidden="true"></span><span data-i18n="nav_list"></span>
                </button>
                <button type="button" class="nav-btn" data-view="memory" onclick="switchTab('memory')">
                    <span class="nav-icon icon-cards" aria-hidden="true"></span><span data-i18n="nav_mem"></span>
                </button>
                <button type="button" class="nav-btn" data-view="trainer" onclick="switchTab('trainer')">
                    <span class="nav-icon icon-timer" aria-hidden="true"></span><span data-i18n="nav_trainer_short"></span>
                </button>
                <button type="button" class="nav-btn" data-view="data" onclick="switchTab('data')">
                    <span class="nav-icon icon-settings" aria-hidden="true"></span><span data-i18n="nav_data"></span>
                </button>
            </div>
        </nav>
    </header>

    <main id="main-container" class="container">

        <div id="view-list" class="view-section active">
            <div class="workspace-heading"><h1 data-i18n="workspace_list_title"></h1></div>
            <div class="control-panel list-controls">
                <div class="list-mode-switcher">
                    <div class="list-mode-group" role="group" aria-labelledby="list-piece-label">
                        <span id="list-piece-label" class="list-mode-group-label" data-i18n="algorithm_type"></span>
                        <div class="list-mode-group-actions">
                            <button type="button" id="btn-algorithm-type-corner" class="action-btn mode-choice-btn" onclick="setAlgorithmType('corner')" data-i18n="algorithm_corners"></button>
                            <button type="button" id="btn-algorithm-type-edge" class="action-btn mode-choice-btn" onclick="setAlgorithmType('edge')" data-i18n="algorithm_edges"></button>
                        </div>
                    </div>
                    <div class="list-mode-group" role="group" aria-labelledby="list-content-label">
                        <span id="list-content-label" class="list-mode-group-label" data-i18n="switch_content"></span>
                        <div class="list-mode-group-actions">
                            <button type="button" id="btn-mode-content-word" class="action-btn mode-choice-btn" onclick="setListContentMode('word')" data-i18n="switch_words"></button>
                            <button type="button" id="btn-mode-content-formula" class="action-btn mode-choice-btn" onclick="setListContentMode('formula')" data-i18n="switch_algorithm"></button>
                        </div>
                    </div>
                    <div class="list-mode-group layout-options" role="group" aria-labelledby="list-layout-label">
                        <span id="list-layout-label" class="list-mode-group-label" data-i18n="switch_layout"></span>
                        <div class="list-mode-group-actions">
                            <button type="button" id="btn-mode-list" class="action-btn mode-choice-btn" onclick="setListLayoutMode('list')" data-i18n="switch_list"></button>
                            <button type="button" id="btn-mode-matrix" class="action-btn mode-choice-btn" onclick="setListLayoutMode('matrix')" data-i18n="switch_matrix"></button>
                        </div>
                    </div>
                </div>

                <div id="list-mode-controls">
                    <label for="char-select" data-i18n="list_start_code" class="control-label"></label>
                    <div class="start-char-navigation">
                        <button type="button" id="list-char-prev" class="action-btn" onclick="stepListCharacter(-1)" data-i18n-aria-label="list_previous_group"><span class="chevron left" aria-hidden="true"></span></button>
                        <select id="char-select" class="form-select"></select>
                        <button type="button" id="list-char-next" class="action-btn" onclick="stepListCharacter(1)" data-i18n-aria-label="list_next_group"><span class="chevron right" aria-hidden="true"></span></button>
                    </div>
                </div>

            </div>

            <div id="list-editor-toolbar" class="list-editor-toolbar">
                <div class="list-editor-summary">
                    <div class="list-progress-group"><span id="list-progress"></span><progress id="list-progress-meter" value="0" max="1" aria-hidden="true"></progress></div>
                    <span id="list-save-status" class="list-save-status" role="status" data-i18n="list_save_hint"></span>
                </div>
                <div class="list-filter-row">
                    <label class="list-search">
                        <span class="search-icon" aria-hidden="true"></span>
                        <input id="list-search" type="search" data-i18n-placeholder="list_search_placeholder" data-i18n-aria-label="list_search_label" oninput="renderCurrentListView()" autocomplete="off">
                    </label>
                    <select id="list-entry-filter" class="form-select" data-i18n-aria-label="list_filter_label" onchange="renderCurrentListView()">
                        <option value="all" data-i18n="list_filter_all"></option>
                        <option value="empty" data-i18n="list_filter_empty"></option>
                        <option value="filled" data-i18n="list_filter_filled"></option>
                    </select>
                </div>
            </div>
            <div id="list-empty-state" class="list-empty-state hidden" data-i18n="list_no_results"></div>
            <div id="grid-area" class="grid-container"></div>
            <p id="list-keyboard-hint" class="list-keyboard-hint" data-i18n="list_keyboard_hint"></p>

            <div class="matrix-workspace">
                <div id="matrix-settings" class="matrix-toolbar hidden">
                    <div class="matrix-tool-group" role="group" aria-labelledby="matrix-grade-title">
                        <div class="matrix-tool-caption">
                            <span id="matrix-grade-title" data-i18n="matrix_familiarity"></span>
                            <span id="active-pair-label" class="active-pair-label" role="status"></span>
                        </div>
                        <div id="matrix-grade-actions" class="matrix-tool-actions matrix-grade-actions">
                            <button type="button" class="btn-grade bg-green" data-grade="green" aria-pressed="false" onclick="setMatrixStatus('green')" data-i18n="fb_good"></button>
                            <button type="button" class="btn-grade bg-yellow" data-grade="yellow" aria-pressed="false" onclick="setMatrixStatus('yellow')" data-i18n="fb_slow"></button>
                            <button type="button" class="btn-grade bg-red" data-grade="red" aria-pressed="false" onclick="setMatrixStatus('red')" data-i18n="fb_wrong"></button>
                            <button type="button" class="btn-grade bg-gray" data-grade="gray" aria-pressed="false" onclick="setMatrixStatus('gray')" data-i18n="btn_hide"></button>
                            <button type="button" id="matrix-marking-done" class="btn-sm matrix-marking-done hidden"
                                onclick="setMatrixMarkingGrade(null)" data-i18n="matrix_finish_marking"></button>
                        </div>
                    </div>
                    <div class="matrix-tool-group" role="group" aria-labelledby="matrix-filter-title">
                        <span id="matrix-filter-title" class="matrix-tool-caption" data-i18n="matrix_practice_filters"></span>
                        <div class="matrix-tool-actions matrix-filter-actions">
                            <button type="button" id="matrix-buffer-filter-btn" class="btn-grade matrix-filter-toggle"
                                onclick="toggleMatrixBufferPairs()" aria-pressed="false" data-i18n="matrix_hide_buffer_pairs"></button>
                            <button type="button" id="matrix-orientation-filter-btn" class="btn-grade matrix-filter-toggle"
                                onclick="toggleMatrixOrientationPairs()" aria-pressed="false"></button>
                        </div>
                    </div>
                    <div class="matrix-tool-group matrix-edit-group" role="group" aria-labelledby="matrix-edit-title">
                        <span id="matrix-edit-title" class="matrix-tool-caption" data-i18n="matrix_edit_lettering"></span>
                        <div class="matrix-tool-actions">
                            <label class="toggle-switch-wrapper matrix-edit-toggle">
                                <span class="toggle-switch-label" data-i18n="lbl_edit_mode"></span>
                                <span class="switch">
                                    <input type="checkbox" id="matrix-edit-toggle" onchange="toggleMatrixEdit(this.checked)"
                                        data-i18n-aria-label="lbl_edit_mode" aria-describedby="matrix-edit-hint" checked>
                                    <span class="slider round"></span>
                                </span>
                            </label>
                            <button type="button" class="btn-sm" onclick="resetDefaultChars()" data-i18n="btn_reset_chars"></button>
                        </div>
                        <span id="matrix-edit-hint" class="visually-hidden" data-i18n="hint_matrix_edit"></span>
                    </div>
                </div>
                <div id="matrix-area" class="matrix-wrapper hidden" role="region" tabindex="0" data-i18n-aria-label="matrix_table_label">
                    <table id="full-matrix" class="matrix-table"></table>
                </div>
            </div>

            <div id="matrix-footer" class="control-row hidden matrix-footer-shell">
                <button class="action-btn matrix-footer-button" onclick="resetAllColors()"
                    data-i18n="btn_reset_color"></button>
            </div>
        </div>

        <div id="view-memory" class="view-section">
            <div class="workspace-heading"><h1 data-i18n="workspace_memory_title"></h1></div>
            <div class="control-panel">
                <div class="control-row control-row-wrap">
                    <div class="dropdown-wrapper range-dropdown">
                        <label data-i18n="lbl_start"
                            style="font-weight:500; display:block; text-align:left; margin-bottom:4px;"></label>
                        <button id="mem_start-btn" onclick="toggleDropdown('mem_start')" class="action-btn dropdown-toggle-btn"
                            style="width:100%; justify-content:space-between; display:inline-flex;"></button>
                        <div class="dropdown-content" id="mem_start-content">
                            <div class="dropdown-toolbar">
                                <button class="btn-sm btn-flex" onclick="toggleAll('mem_start', true)" style="flex:1;"
                                    data-i18n="sel_full"></button>
                                <button class="btn-sm btn-flex" onclick="toggleAll('mem_start', false)" style="flex:1;"
                                    data-i18n="sel_none"></button>
                            </div>
                            <div id="mem-start-range-grid" class="checkbox-grid"></div>
                        </div>
                    </div>

                    <div class="dropdown-wrapper range-dropdown">
                        <label data-i18n="lbl_end"
                            style="font-weight:500; display:block; text-align:left; margin-bottom:4px;"></label>
                        <button id="mem_end-btn" onclick="toggleDropdown('mem_end')" class="action-btn dropdown-toggle-btn"
                            style="width:100%; justify-content:space-between; display:inline-flex;"></button>
                        <div class="dropdown-content" id="mem_end-content">
                            <div class="dropdown-toolbar">
                                <button class="btn-sm btn-flex" onclick="toggleAll('mem_end', true)" style="flex:1;"
                                    data-i18n="sel_full"></button>
                                <button class="btn-sm btn-flex" onclick="toggleAll('mem_end', false)" style="flex:1;"
                                    data-i18n="sel_none"></button>
                            </div>
                            <div id="mem-end-range-grid" class="checkbox-grid"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-area flashcard-card" id="memory-card" onclick="toggleMemoryAnswer()">
                <div class="question" id="mem-q">FO</div>
                <div class="answer-text" id="mem-a">...</div>

                <div class="flashcard-subtext" id="mem-hint"
                    data-i18n="hint_click_flip"></div>

                <div id="mem-grading-area" class="grading-btns hidden">
                    <button class="grading-btn btn-grade-red" onclick="event.stopPropagation(); markMemStatus('red')">
                        <span data-i18n="fb_wrong"></span>
                    </button>
                    <button class="grading-btn btn-grade-yellow"
                        onclick="event.stopPropagation(); markMemStatus('yellow')">
                        <span data-i18n="fb_slow"></span>
                    </button>
                    <button class="grading-btn btn-grade-green"
                        onclick="event.stopPropagation(); markMemStatus('green')">
                        <span data-i18n="fb_good"></span>
                    </button>
                </div>
            </div>

        </div>

        <div id="view-trainer" class="view-section">
            <div class="workspace-heading"><h1 data-i18n="workspace_trainer_title"></h1></div>
            <div class="control-panel">
                <div class="control-row control-row-wrap">
                    <div class="dropdown-wrapper range-dropdown">
                        <label data-i18n="lbl_start"
                            style="font-weight:500; display:block; text-align:left; margin-bottom:4px;"></label>
                        <button id="trainer_start-btn" onclick="toggleDropdown('trainer_start')" class="action-btn dropdown-toggle-btn"
                            style="width:100%; justify-content:space-between; display:inline-flex;"></button>
                        <div class="dropdown-content" id="trainer_start-content">
                            <div class="dropdown-toolbar">
                                <button class="btn-sm btn-flex" onclick="toggleAll('trainer_start', true)" style="flex:1;"
                                    data-i18n="sel_full"></button>
                                <button class="btn-sm btn-flex" onclick="toggleAll('trainer_start', false)" style="flex:1;"
                                    data-i18n="sel_none"></button>
                            </div>
                            <div id="trainer-start-range-grid" class="checkbox-grid"></div>
                        </div>
                    </div>

                    <div class="dropdown-wrapper range-dropdown">
                        <label data-i18n="lbl_end"
                            style="font-weight:500; display:block; text-align:left; margin-bottom:4px;"></label>
                        <button id="trainer_end-btn" onclick="toggleDropdown('trainer_end')" class="action-btn dropdown-toggle-btn"
                            style="width:100%; justify-content:space-between; display:inline-flex;"></button>
                        <div class="dropdown-content" id="trainer_end-content">
                            <div class="dropdown-toolbar">
                                <button class="btn-sm btn-flex" onclick="toggleAll('trainer_end', true)" style="flex:1;"
                                    data-i18n="sel_full"></button>
                                <button class="btn-sm btn-flex" onclick="toggleAll('trainer_end', false)" style="flex:1;"
                                    data-i18n="sel_none"></button>
                            </div>
                            <div id="trainer-end-range-grid" class="checkbox-grid"></div>
                        </div>
                    </div>
                </div>
                <div class="control-row control-row-wrap trainer-toolbar">
                    <div class="trainer-mode-group">
                        <button id="btn-trainer-content-word" class="action-btn" onclick="setTrainerContentGroup('word')" data-i18n="switch_words"></button>
                        <button id="btn-trainer-content-formula" class="action-btn" onclick="setTrainerContentGroup('formula')" data-i18n="switch_algorithm"></button>
                        <button id="btn-trainer-type-corner" class="action-btn" onclick="setTrainerAlgorithmType('corner')"
                            data-i18n="algorithm_corners"></button>
                        <button id="btn-trainer-type-edge" class="action-btn" onclick="setTrainerAlgorithmType('edge')"
                            data-i18n="algorithm_edges"></button>
                    </div>
                </div>
            </div>
            <div class="card-area-test trainer-card">
                <div class="trainer-panel">
                    <div class="trainer-scramble-header">
                        <div class="trainer-panel-label" data-i18n="trainer_scramble_label"></div>
                        <div class="trainer-toolbar-actions">
                            <button class="action-btn" id="trainer-prev-btn" onclick="goToPreviousTrainerScramble()"
                                data-i18n="btn_prev_scramble"></button>
                            <button class="action-btn" id="trainer-generate-btn" onclick="goToNextTrainerScramble()"
                                data-i18n="btn_generate_scramble"></button>
                        </div>
                    </div>
                    <div id="trainer-scramble" class="trainer-scramble-text"
                        data-i18n="trainer_scramble_placeholder"></div>
                </div>
                <div class="trainer-timer-shell">
                    <div id="trainer-timer" class="trainer-timer-display">0.00</div>
                    <div id="trainer-status" class="trainer-status" role="status"></div>
                </div>
                <div id="trainer-penalty-shell" class="trainer-penalty-shell hidden">
                    <div class="trainer-penalty-row trainer-penalty-row-compact">
                    <button id="trainer-plus2-btn" class="action-btn trainer-action-btn trainer-icon-btn" onclick="toggleTrainerPenalty('plus2')"
                        data-i18n="btn_penalty_plus2"></button>
                    <button id="trainer-dnf-btn" class="action-btn trainer-action-btn trainer-icon-btn" onclick="toggleTrainerPenalty('dnf')"
                        data-i18n="btn_penalty_dnf"></button>
                    <button id="trainer-delete-btn" class="action-btn trainer-action-btn trainer-delete-btn trainer-icon-btn"
                        onclick="toggleTrainerDeleteConfirm()"
                        data-i18n="btn_delete_solve"></button>
                    <button id="trainer-delete-confirm-btn"
                        class="action-btn trainer-action-btn trainer-delete-confirm-btn trainer-icon-btn hidden"
                        onclick="confirmDeleteLatestTrainerRecord()" data-i18n="btn_delete_confirm"></button>
                    </div>
                </div>
            </div>
            <div class="trainer-averages-shell">
                <div class="trainer-panel-label" data-i18n="trainer_averages_label"></div>
                <div class="trainer-averages-grid">
                    <div class="trainer-average-card">
                        <div class="trainer-average-name">ao5</div>
                        <div id="trainer-avg-5" class="trainer-average-value is-empty">--</div>
                    </div>
                    <div class="trainer-average-card">
                        <div class="trainer-average-name">ao12</div>
                        <div id="trainer-avg-12" class="trainer-average-value is-empty">--</div>
                    </div>
                    <div class="trainer-average-card">
                        <div class="trainer-average-name">ao50</div>
                        <div id="trainer-avg-50" class="trainer-average-value is-empty">--</div>
                    </div>
                    <div class="trainer-average-card">
                        <div class="trainer-average-name">ao100</div>
                        <div id="trainer-avg-100" class="trainer-average-value is-empty">--</div>
                    </div>
                </div>
            </div>
            <div class="trainer-history-shell">
                <div class="trainer-panel-label" data-i18n="trainer_history_label"></div>
                <div id="trainer-history" class="trainer-history-list"></div>
                <div id="trainer-history-clear-group" class="trainer-history-clear-group">
                    <button id="trainer-clear-menu-btn" class="action-btn trainer-history-clear-trigger"
                        onclick="toggleTrainerClearMenu(event)" data-i18n="btn_clear_records"
                        aria-haspopup="true" aria-expanded="false"></button>
                    <div id="trainer-clear-menu" class="trainer-history-clear-menu hidden">
                        <button type="button" class="action-btn trainer-history-clear-option"
                            onclick="requestClearTrainerRecords('corner')"
                            data-i18n="btn_clear_corners_records"></button>
                        <button type="button" class="action-btn trainer-history-clear-option"
                            onclick="requestClearTrainerRecords('edge')"
                            data-i18n="btn_clear_edges_records"></button>
                        <button type="button" class="action-btn trainer-history-clear-option"
                            onclick="setTrainerClearMenuOpen(false)" data-i18n="btn_delete_cancel"></button>
                    </div>
                </div>
            </div>
        </div>
        <div id="view-data" class="view-section">
            <div class="workspace-heading"><h1 data-i18n="workspace_data_title"></h1></div>
            <div class="settings-workspace">
                <section class="settings-section settings-inline" aria-labelledby="settings-language-title">
                    <h2 id="settings-language-title" data-i18n="settings_language_label"></h2>
                    <button type="button" id="lang-toggle-btn" class="action-btn" onclick="toggleLanguage()"
                        data-i18n="btn_toggle_lang"></button>
                </section>

                <section class="settings-section" aria-labelledby="settings-lettering-title">
                    <h2 id="settings-lettering-title" data-i18n="settings_chars_label"></h2>
                    <div class="settings-char-btn-row" role="group" aria-labelledby="settings-lettering-title">
                        <button type="button" id="chars-zh-btn" class="action-btn settings-char-btn"
                            onclick="setCharScheme('zh')" data-i18n="btn_chars_zh"></button>
                        <button type="button" id="chars-en-btn" class="action-btn settings-char-btn"
                            onclick="setCharScheme('en')" data-i18n="btn_chars_en"></button>
                        <button type="button" id="chars-custom-btn" class="action-btn settings-char-btn"
                            onclick="setCharScheme('custom')" data-i18n="btn_chars_custom"></button>
                    </div>
                    <details class="lettering-disclosure">
                        <summary data-i18n="settings_edit_lettering"></summary>
                        <div id="lettering-net-editor" class="lettering-net-editor"></div>
                    </details>
                </section>

                <section class="settings-section" aria-labelledby="settings-buffer-title">
                    <h2 id="settings-buffer-title" data-i18n="settings_buffer_label"></h2>
                    <div class="settings-buffer-grid">
                        <label class="settings-buffer-field" for="corner-buffer-select">
                            <span data-i18n="settings_corner_buffer"></span>
                            <span class="styled-select-wrapper">
                                <select id="corner-buffer-select" class="styled-select"
                                    onchange="setAlgorithmBuffer('corner', this.value)"></select>
                                <span class="select-arrow" aria-hidden="true"></span>
                            </span>
                        </label>
                        <label class="settings-buffer-field" for="edge-buffer-select">
                            <span data-i18n="settings_edge_buffer"></span>
                            <span class="styled-select-wrapper">
                                <select id="edge-buffer-select" class="styled-select"
                                    onchange="setAlgorithmBuffer('edge', this.value)"></select>
                                <span class="select-arrow" aria-hidden="true"></span>
                            </span>
                        </label>
                    </div>
                    <p class="settings-info-text settings-note">
                        <span data-i18n="settings_formula_prefix"></span><a
                            href="https://blddb.net/" target="_blank" rel="noopener noreferrer">BLDDB</a><span
                            data-i18n="settings_formula_suffix"></span>
                    </p>
                </section>

                <section class="settings-section" aria-labelledby="settings-backup-title">
                    <h2 id="settings-backup-title" data-i18n="title_backup"></h2>
                    <div class="export-controls">
                        <div class="styled-select-wrapper">
                            <select id="export-type" class="styled-select" data-i18n-aria-label="settings_export_format">
                                <option value="json" data-i18n="opt_json"></option>
                                <option value="csv" data-i18n="opt_csv"></option>
                            </select>
                            <span class="select-arrow" aria-hidden="true"></span>
                        </div>
                        <button class="action-btn btn-export" onclick="exportData()" data-i18n="btn_export_exec"></button>
                    </div>
                    <div class="export-controls">
                        <div class="styled-select-wrapper file-input-wrapper">
                            <input type="file" id="file-input" accept=".json" class="file-input"
                                data-i18n-aria-label="lbl_select_file">
                        </div>
                        <button class="action-btn btn-export" onclick="importData()" data-i18n="btn_import"></button>
                    </div>
                    <div class="settings-danger-row">
                        <button class="btn-danger action-btn btn-full-danger" onclick="clearAllData()"
                            data-i18n="btn_clear_all"></button>
                    </div>
                </section>

                <section id="pwa-install-group" class="settings-section settings-inline hidden" aria-labelledby="settings-install-title">
                    <div>
                        <h2 id="settings-install-title" data-i18n="settings_install_label"></h2>
